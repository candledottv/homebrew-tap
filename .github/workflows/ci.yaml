name: Formula
on:
  push:
    branches: [main]
  pull_request:
jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Tap this checkout and audit, install and test the formula
        run: |
          brew tap candledottv/tap "$(pwd)"
          brew audit --strict candledottv/tap/candle
          brew install --formula candledottv/tap/candle
          brew test candledottv/tap/candle
